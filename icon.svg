<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2028"/><stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b3b" stop-opacity=".95"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee86a" stop-opacity=".95"/><stop offset="1" stop-color="#2ee86a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b7bff" stop-opacity=".95"/><stop offset="1" stop-color="#3b7bff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffb23b"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#sq)" style="isolation:isolate">
    <g style="mix-blend-mode:screen">
      <polygon points="490,250 534,250 330,900 110,900" fill="url(#r)"/>
    </g>
    <g style="mix-blend-mode:screen">
      <polygon points="490,250 534,250 640,900 384,900" fill="url(#g)"/>
    </g>
    <g style="mix-blend-mode:screen">
      <polygon points="490,250 534,250 914,900 694,900" fill="url(#b)"/>
    </g>
    <circle cx="512" cy="250" r="120" fill="url(#halo)"/>
  </g>
  <!-- fixture -->
  <rect x="432" y="168" width="160" height="96" rx="26" fill="#2a2e38" stroke="#3d4350" stroke-width="6"/>
  <circle cx="512" cy="250" r="40" fill="url(#lens)"/>
  <!-- voice waveform -->
  <g fill="#ffffff">
    <rect x="296" y="742" width="36" height="56"  rx="18"/>
    <rect x="356" y="714" width="36" height="112" rx="18"/>
    <rect x="416" y="680" width="36" height="180" rx="18"/>
    <rect x="476" y="650" width="36" height="240" rx="18"/>
    <rect x="536" y="690" width="36" height="160" rx="18"/>
    <rect x="596" y="664" width="36" height="212" rx="18"/>
    <rect x="656" y="710" width="36" height="120" rx="18"/>
    <rect x="716" y="742" width="36" height="56"  rx="18"/>
  </g>
</svg>
